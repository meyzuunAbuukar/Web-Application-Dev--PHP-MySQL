<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Grade Management System</title>
</head>
<body>

<h2>Student Grade Management System</h2>

<form action="process.php" method="post"
      enctype="multipart/form-data">

    <label>Student Full Name:</label><br>
    <input type="text" name="student_name" required>
    <br><br>

    <label>Student ID:</label><br>
    <input type="text" name="student_id" required>
    <br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender" value="Male" required> Male
    <input type="radio" name="gender" value="Female"> Female
    <br><br>

    <label>Faculty:</label><br>
    <select name="faculty" required>
        <option value="">Select Faculty</option>
        <option value="IT">Information Technology</option>
        <option value="Business">Business</option>
        <option value="Engineering">Engineering</option>
        <option value="Health Science">Health Science</option>
    </select>
    <br><br>

    <label>PHP Mark:</label><br>
    <input type="number" name="php_mark"
           min="0" max="100" required>
    <br><br>

    <label>Database Mark:</label><br>
    <input type="number" name="database_mark"
           min="0" max="100" required>
    <br><br>

    <label>Networking Mark:</label><br>
    <input type="number" name="networking_mark"
           min="0" max="100" required>
    <br><br>

    <label>Student Certificate:</label><br>
    <input type="file" name="certificate" required>
    <br><br>

    <button type="submit">Submit and Calculate</button>
    <button type="reset">Reset</button>

</form>

</body>
</html>
